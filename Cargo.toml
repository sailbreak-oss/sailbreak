[workspace]
members = ["crates/lctrl-core", "crates/lctrl-hal", "crates/lctrl-hal-win", "crates/lctrl-hal-linux", "crates/vantage-cli", "crates/lctrl-tune", "crates/vantage-gui", "crates/vantage-daemon", "vantage"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

repository = "https://github.com/vantage-oss/vantage-cli"
homepage = "https://github.com/vantage-oss/vantage-cli"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
