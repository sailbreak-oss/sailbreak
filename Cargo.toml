[workspace]
members = ["crates/lctrl-core", "crates/lctrl-hal", "crates/lctrl-hal-win", "crates/lctrl-hal-linux", "crates/sailbreak-cli", "crates/lctrl-tune", "crates/sailbreak-gui", "crates/sailbreak-daemon", "crates/proto-ui-gpui", "sailbreak"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

repository = "https://github.com/voyage-control/sailbreak"
homepage = "https://github.com/voyage-control/sailbreak"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
