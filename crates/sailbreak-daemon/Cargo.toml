[package]
name = "sailbreak-daemon"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true
description = "Optional local event daemon for Sailbreak hardware control"

[lib]
name = "sailbreak_daemon"

[[bin]]
name = "sailbreakd"
path = "src/main.rs"

[dependencies]
lctrl-core = { path = "../lctrl-core" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
lctrl-hal = { path = "../lctrl-hal" }
lctrl-hal-linux = { path = "../lctrl-hal-linux" }

[target.'cfg(windows)'.dependencies]
lctrl-hal = { path = "../lctrl-hal" }
lctrl-hal-win = { path = "../lctrl-hal-win" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
