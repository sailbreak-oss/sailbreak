[package]
name = "sailbreak-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false
repository.workspace = true
description = "Command-line surface for independent Lenovo hardware control"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
lctrl-core = { path = "../lctrl-core" }
lctrl-hal = { path = "../lctrl-hal" }
lctrl-tune = { path = "../lctrl-tune" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
parking_lot.workspace = true
