[package]
name = "lctrl-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
lctrl-core = { path = "../lctrl-core" }
lctrl-hal = { path = "../lctrl-hal" }
lctrl-tune = { path = "../lctrl-tune" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
parking_lot.workspace = true
