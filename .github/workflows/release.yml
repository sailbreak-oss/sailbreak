name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: sailbreak-linux-x86_64.tar.gz
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: sailbreak-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build release binaries
        run: cargo build --release --locked --package sailbreak --package sailbreak-daemon --package sailbreak-gui --target ${{ matrix.target }}
      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sailbreak" "target/${{ matrix.target }}/release/sailbreak-cli"
          tar -C target/${{ matrix.target }}/release -czf "dist/${{ matrix.archive }}" sailbreak sailbreak-cli sailbreakd sailbreak-gui
          (cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sailbreak.exe" "target/${{ matrix.target }}/release/sailbreak-cli.exe"
          Compress-Archive -Path `
            "target/${{ matrix.target }}/release/sailbreak.exe", `
            "target/${{ matrix.target }}/release/sailbreak-cli.exe", `
            "target/${{ matrix.target }}/release/sailbreakd.exe", `
            "target/${{ matrix.target }}/release/sailbreak-gui.exe" `
            -DestinationPath "dist/${{ matrix.archive }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content "dist/${{ matrix.archive }}.sha256"

      - name: Build NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $version = "${{ github.ref_name }}".TrimStart('v')
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $workspace = $env:GITHUB_WORKSPACE
          $binDir = Join-Path $workspace 'target\x86_64-pc-windows-msvc\release'
          $outDir = Join-Path $workspace 'dist'
          $script = Join-Path $workspace 'installer\sailbreak.nsi'
          & $makensis "/DPRODUCT_VERSION=$version" "/DBIN_DIR=$binDir" "/DOUT_DIR=$outDir" $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $outDir "sailbreak-v$version-windows-x86_64-setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
