name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun for the Proto UI bundle check
        if: matrix.os == 'ubuntu-latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Check the recorded Proto UI bundle identity
        if: matrix.os == 'ubuntu-latest'
        working-directory: tools/proto-ui-bridge
        run: |
          node --test scripts/build-bundle.test.mjs
          bun run bundle:check
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Probe Windows capability surface
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & target/release/sailbreak.exe --json info
          $allowedExitCodes = @(0, 3, 4, 5, 6, 7)
          if ($allowedExitCodes -notcontains $LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: sailbreak-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/sailbreak
            target/release/sailbreak.exe
            target/release/sailbreakd
            target/release/sailbreakd.exe
            target/release/sailbreak-gui
            target/release/sailbreak-gui.exe
    env:
      RUSTFLAGS: -Dwarnings
